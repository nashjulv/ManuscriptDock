[package]
name = "manuscriptdock-desktop"
version = "0.52.0"
description = "ManuscriptDock local-first manuscript submission workspace"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "manuscriptdock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1"
manuscript-core = { path = "../../../crates/manuscript-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
encoding_rs = "0.8"
flate2 = "1"
scraper = "0.24"
tokio = { version = "1", features = ["net", "time", "macros", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSWindow", "NSEvent", "NSResponder", "NSView", "NSGraphics", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue", "NSNotification", "NSOperation", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }
