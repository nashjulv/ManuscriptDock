name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-command: npm run bundle:mac
            artifact-name: ManuscriptDock-macOS-universal
            artifact-path: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app
            release-files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            build-command: npm run bundle:windows
            artifact-name: ManuscriptDock-Windows-x64
            artifact-path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            release-files: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Rust targets for workspace toolchain
        shell: bash
        run: rustup target add ${RUST_TARGETS//,/ }
        env:
          RUST_TARGETS: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci

      - name: Build installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: ${{ matrix.build-command }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release-files }}
