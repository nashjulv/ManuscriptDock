<body>
<header class="top" id="header"></header>

<dialog id="overlay" aria-labelledby="dialog-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* 模拟数据仅存于当前页面内存；不联网、不修改原稿、不自动投稿。 */
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='zh',size=15;try{lang=localStorage.getItem('md-demo-lang')||'zh';size=Number(localStorage.getItem('md-demo-size'))||15}catch(e){}
const t=(zh,en)=>lang==='en'?en:zh;
const labels={overview:['概览','Overview'],target:['目标与要求','Target & requirements'],materials:['投稿资料','Materials'],check:['检查与修订','Checks & revisions'],package:['投稿包','Submission package'],log:['投稿记录','Submission records'],versions:['版本','Versions'],sources:['来源与依据','Sources'],proof:['存证','Evidence'],activity:['活动记录','Activity']};
const label=k=>t(...labels[k]);
function makePaper(id,title,v,target,extra={}){return {id,title,v,target,versions:Array.from({length:v},(_,i)=>i+1),requirements:true,materials:false,author:'Lin Chen',email:'lin.chen@example.org',declaration:'',attachment:true,checked:false,confirmed:false,stale:false,exported:false,archived:false,records:[],exports:[],events:[],lifeHistory:['draft',...(target||extra.materials?['preparing']:[])],...extra}}
let papers=[makePaper(1,'Aerial Image Restoration',3,'Journal of Example'),makePaper(2,'Graph Neural Networks Survey',2,'',{stale:true,materials:true,declaration:'The authors declare no competing interests.'}),makePaper(3,'Medical Data Ethics',4,'Ethics Review',{materials:true,declaration:'The authors declare no competing interests.',checked:true,confirmed:true,exported:true,exports:[{v:4,target:'Ethics Review',time:'2026-09-14 16:40'}]})];
let current=null,page='overview',filter='all',query='',sort='recent',nextId=4,taskToken=0,returnFocus=null,confirmAction=null,toastTimer;
let auxiliary={block:false,stale:false,target:''};
const hasBlockers=x=>!x.target||!x.requirements||!x.materials||!x.checked||!x.confirmed||x.stale;
let section='mine',library='public',libraryOpen=true,mineOpen=true,libraryQuery='',libraryFilters={field:'',type:'',year:''};
const libraries=[{id:'public',name:['公共论文库','Public library']},{id:'favorites',name:['我的收藏','Favorites']},{id:'group',name:['课题组论文库','Research group library']}];
const catalog=[
{id:101,title:'Transparent Image Restoration',author:'M. Wang, L. Chen',field:'计算机科学',type:'研究论文',year:'2026',source:'Open Research',libraries:['public','group'],favorite:true,abstract:'提出可复现的图像恢复方法，比较不同噪声条件下的实验结果。'},
{id:102,title:'Graph Learning: A Reproducibility Survey',author:'J. Li',field:'计算机科学',type:'综述',year:'2025',source:'Research Archive',libraries:['public'],favorite:false,abstract:'梳理图学习中的数据划分、实验协议与可复现性问题。'},
{id:103,title:'Ethical Governance of Clinical Data',author:'A. Zhang',field:'医学伦理',type:'研究论文',year:'2024',source:'Ethics Collection',libraries:['public','group'],favorite:false,abstract:'讨论临床数据共享中的知情同意、隐私保护与伦理治理。'},
{id:104,title:'Open Dataset Documentation Protocol',author:'Research Methods Group',field:'研究方法',type:'预印本',year:'2026',source:'课题组共享',libraries:['group'],favorite:true,abstract:'用于课题组内部的数据集文档协议与透明研究实践。'}];
const lifeNames={draft:['草稿','Draft'],preparing:['准备中','Preparing'],exported:['投稿包已生成','Package generated'],submitted:['已记录投稿','Submission recorded'],revision:['修回中','In revision'],completed:['已完成','Completed'],archived:['已归档','Archived']};
function lifecycle(x){if(x.archived)return 'archived';if(x.completed)return 'completed';if(x.revision)return 'revision';if(x.records.length)return 'submitted';if(x.exports.length)return 'exported';return x.target||x.materials||x.lifeHistory.includes('preparing')?'preparing':'draft'}
const lifeSelection=new Map();
function lifeState(x,key){
if(key===lifecycle(x))return 'current';
const reached={draft:true,preparing:!!x.target||x.materials||x.exports.length>0,exported:x.exports.length>0,submitted:x.records.length>0,revision:!!x.revision,completed:!!x.completed,archived:x.archived};
return reached[key]||x.lifeHistory.includes(key)?'done':'future';
}
const lifeStateName=state=>state==='done'?t('已完成 / 历史','Completed / history'):state==='current'?t('当前阶段','Current stage'):t('未来 / 未解锁','Future / locked');
function lifeSummary(x){
return `<ol class="life-track life-summary" aria-label="${esc(t('生命周期状态（只读）','Lifecycle status (read-only)'))}">${Object.keys(lifeNames).map(key=>{
const state=lifeState(x,key);
return `<li class="life-node ${state}" ${state==='current'?'aria-current="step"':''}><span class="life-dot" aria-hidden="true">${state==='done'?'&#10003;':''}</span><span class="life-name">${t(...lifeNames[key])}</span><span class="life-state">${state==='done'?t('已完成 · 历史','Done · History'):state==='current'?t('当前阶段','Current stage'):t('尚未经历','Not reached')}</span></li>`;
}).join('')}</ol>`;
}
function lifeProgress(x){
const selected=lifeSelection.get(x.id)||lifecycle(x);
return `<div class="life-track" role="tablist" aria-label="${esc(x.title+' · '+t('论文生命周期','Paper lifecycle'))}">${Object.keys(lifeNames).map(key=>{
const name=t(...lifeNames[key]),state=lifeState(x,key),tip=`${name} · ${lifeStateName(state)}${key==='revision'?' · '+t('规划能力','Planned capability'):''}`;
return `<button type="button" id="life-${x.id}-${key}" class="life-node ${state}" role="tab" data-action="stage:${x.id}:${key}" tabindex="${key===selected?0:-1}" aria-selected="${key===selected}" aria-controls="life-panel-${x.id}" title="${esc(tip)}" aria-label="${esc(tip)}" ${state==='current'?'aria-current="step"':''}><span class="life-dot" aria-hidden="true">${state==='done'?'&#10003;':''}</span><span>${name}</span><span class="life-state">${lifeStateName(state)}</span><span class="life-tip" aria-hidden="true">${esc(tip)}</span></button>`;
}).join('')}</div><section id="life-panel-${x.id}" class="life-panel" role="tabpanel" tabindex="0" aria-labelledby="life-${x.id}-${selected}">${lifeContent(x,selected)}</section>`;
}
function lifeContent(x,key){
const state=lifeState(x,key),active=state==='current'&&!x.archived,action=(zh,en,dest,primary=false)=>btn(t(zh,en),`stage-open:${x.id}:${dest}`,primary?'primary':''),history=()=>`<div class="actions">${action('查看活动历史','View activity history','activity')}</div>`;
const heading=`<div class="row between"><h3>${t(...lifeNames[key])}</h3><span class="badge">${lifeStateName(state)}</span></div><p class="meta">${esc(x.title)} · ${t('当前工作版本','Working version')} v${x.v}</p>`;
if(key==='revision')return heading+`<p><span class="demo">${t('规划能力','PLANNED')}</span></p><p>${t('修回任务、审稿意见关联和回复信工作流尚未实现；不提供开始修回或同步状态操作。当前记录不能证明期刊已要求修回。','Revision tasks, review links and response letters are not implemented. No revision or synchronization action is available. Current records do not verify a revision request.')}</p>${state==='future'?`<p class="meta">${t('尚未解锁；可查看规划说明。','Not unlocked; planning notes only.')}</p>`:history()}`;
if(state==='future')return heading+`<p>${t('尚未解锁：该论文尚无此阶段的有效记录。请先完成当前阶段；查看节点不会推进进度或执行投稿。','Not unlocked: this paper has no valid record for this stage. Complete the current stage first. Viewing a node does not advance or submit the paper.')}</p><p class="meta">${t('当前阶段','Current stage')}：${t(...lifeNames[lifecycle(x)])}${x.archived?' · '+t('项目已归档，未经历的阶段不会自动完成。','Archiving does not complete skipped stages.'):''}</p>`;
if(key==='draft')return heading+`<p>${t('原稿已保留，工作区包含','Original preserved; workspace contains')} ${x.versions.length} ${t('个版本。','versions.')} ${esc(x.target)||t('尚未选择目标期刊。','No target selected.')}</p>`+(active?`<div class="actions">${action('继续处理','Continue','overview',true)}${action('设置目标','Set target','target')}</div>`:history());
if(key==='preparing')return heading+`<p>${active?t('完成以下任务后可生成投稿包；不会自动投稿。','Complete these tasks to unlock packaging; no automatic submission.'):t('已进入过准备阶段；以下为当前版本状态，不冒充历史检查快照。','Preparation has been reached. The following reflects the current version, not a historical check snapshot.')}</p>${[[t('目标与要求','Target & requirements'),!!x.target&&x.requirements],[t('投稿资料与声明','Materials & declaration'),x.materials],[t('基础检查与作者确认','Basic checks & author confirmation'),x.checked&&x.confirmed&&!x.stale]].map(([name,done])=>`<div class="task"><span class="circle" aria-hidden="true">${done?'&#10003;':'!'}</span><div>${name}<p>${done?t('已完成 · 当前上下文有效','Complete · Current context valid'):t('待处理 / 需重新确认','Pending / Reconfirmation needed')}</p></div></div>`).join('')}`+(active?`<div class="actions">${action('继续处理','Continue','overview',true)}${action('去补充资料','Complete materials','materials')}${action('运行基础检查','Run basic checks','basic')}</div>`:history());
if(key==='exported')return heading+`<p>${t('导出历史；导出不等于已投稿。','Export history; export is not submission.')}</p>${x.exports.map(e=>`<p class="meta">${t('导出时间','Exported at')}：${esc(e.time)} · v${esc(e.v)} · ${esc(e.target)}</p>`).join('')||`<p>${t('暂无导出历史。','No export history.')}</p>`}<div class="actions">${action('查看投稿包','View package','package',active)}${active?action('登记投稿','Record submission','log'):''}</div>`;
if(key==='submitted')return heading+`<p class="notice">${t('作者手动记录事实 · 未经平台验证；不代表平台接收、送审或录用。','Author-entered facts · Not platform-verified; not proof of receipt, review or acceptance.')}</p>${x.records.map(r=>`<div class="task"><div>${esc(r.platform)} · ${esc(r.number)}<p>${esc(r.date)} · v${esc(r.v)}</p><p>${esc(r.notes)}</p></div></div>`).join('')}<div class="actions">${action('查看投稿记录','View submission records','log',active)}</div>`;
return heading+`<p>${key==='archived'?t('项目已归档，只读保留版本、导出与手动投稿历史；归档不表示投稿流程全部完成。','Archived: versions, exports and manual records are preserved read-only. Archiving does not complete all submission stages.'):t('已标记为完成，不代表期刊录用或外部平台确认。','Marked completed; not journal acceptance or external confirmation.')}</p><p class="meta">${x.versions.length} ${t('个版本','versions')} · ${x.exports.length} ${t('次导出','exports')} · ${x.records.length} ${t('条手动投稿记录','manual submission records')}</p><div class="actions">${action('查看论文档案','View archive','versions',active)}${action('查看活动历史','View activity history','activity')}</div>`;
}
function mainNav(){return `<div class="nav-group">${btn(`${libraryOpen?'▾':'▸'} ${t('论文库','Libraries')}`,'toggle-library','',`aria-expanded="${libraryOpen}" aria-controls="library-nav"`)}${libraryOpen?`<div id="library-nav" class="nav-children">${libraries.map(l=>btn(esc(t(...l.name)),`library:${l.id}`,!current&&section==='library'&&library===l.id?'active':'',`aria-current="${!current&&section==='library'&&library===l.id?'page':'false'}"`)).join('')}${btn('+ '+t('添加论文库','Add library'),'add-library')}</div>`:''}</div><div class="nav-group">${btn(`${mineOpen?'▾':'▸'} ${t('我的论文','My papers')}（${papers.length}）`,'toggle-mine',!current&&section==='mine'?'active':'',`aria-expanded="${mineOpen}" aria-controls="mine-nav"`)}${mineOpen?`<div id="mine-nav" class="nav-children life-nav">${btn(`<span>${t('全部','All')}</span><span class="nav-num">${papers.length}</span>`, 'my-all','life-all '+(!current&&section==='mine'&&filter==='all'?'active':''),`aria-pressed="${!current&&section==='mine'&&filter==='all'}"`)}<ol class="life-steps" aria-label="${t('按当前主生命周期筛选','Filter by current primary lifecycle')}">${Object.keys(lifeNames).map(s=>`<li>${btn(`<span>${t(...lifeNames[s])}</span><span class="nav-num">${papers.filter(x=>lifecycle(x)===s).length}</span>`,`life:${s}`,!current&&section==='mine'&&filter===s?'active':'',`aria-pressed="${!current&&section==='mine'&&filter===s}"`)}</li>`).join('')}</ol><p class="nav-rule">${t('每篇仅计入一个当前阶段；历史不重复计数。','One current stage per paper; history is not counted twice.')}</p></div>`:''}</div>`}
const p=()=>papers.find(x=>x.id===current);
function status(x){if(x.archived)return 'archived';if(x.stale)return 'stale';if(x.records.length)return 'submitted';if(x.exported)return 'exported';if(x.target&&x.requirements&&x.materials&&x.checked&&x.confirmed)return 'ready';return 'preparing'}
const statusNames={all:['全部','All'],preparing:['准备中','Preparing'],ready:['可以生成投稿包','Ready to package'],exported:['已生成投稿包 · 未登记投稿','Package generated · not recorded'],submitted:['已记录投稿','Submission recorded'],stale:['需要重新检查','Recheck required'],archived:['已归档','Archived']};
const sn=s=>t(...statusNames[s]);
function next(x){if(x.archived)return ['versions',t('查看论文档案','View archive'),t('项目已归档，只读保留历史。','Archived project. History is preserved.')];if(x.stale)return ['check',t('重新运行检查','Run checks again'),t('版本或目标已变化；旧检查不适用于当前上下文。','The version or target changed; previous checks are no longer current.')];if(!x.materials)return ['materials',t('补充利益冲突声明','Complete submission materials'),t('作者声明尚未确认，暂时阻断投稿包导出。','An unconfirmed author declaration blocks package export.')];if(!x.checked||!x.confirmed)return ['check',x.checked?t('确认检查问题','Review findings'):t('运行基础 / 目标检查','Run manuscript checks'),t('检查结构并由作者确认摘要，原稿不会自动修改。','Check structure and confirm the abstract without modifying the original.')];if(!x.target||!x.requirements)return ['target',t('选择目标 / 更新要求','Select target / update requirements'),t('绑定目标和要求快照后可生成投稿包。','Bind a target and requirements snapshot to unlock the package.')];if(!x.exported)return ['package',t('预览并导出投稿包','Preview and export package'),t('所有阻断项已处理；导出不会自动投稿。','All blockers resolved. Exporting does not submit your paper.')];if(!x.records.length)return ['log',t('登记投稿','Record submission'),t('请手动登记投稿事实。','Record submission manually.')];return ['activity',t('查看投稿历史','View submission history'),t('投稿事实由作者登记，未通过外部平台验证。','Author-entered record; not verified by an external platform.')];}
function btn(text,action,cls='',attrs=''){return `<button type="button" class="${cls}" data-action="${action}" ${attrs}>${text}</button>`}
function badge(x){const s=status(x);return `<span class="badge ${s==='stale'||s==='preparing'?'warn':'good'}">${s==='stale'||s==='preparing'?'!':'✓'} ${sn(s)}</span>`}
function event(x,zh,en){if(x.target||x.materials)x.lifeHistory.push('preparing');x.lifeHistory=[...new Set([...x.lifeHistory,lifecycle(x)])];x.events.unshift({zh,en,time:new Date().toLocaleString('sv-SE')});}
function toast(zh,en){clearTimeout(toastTimer);$('#toast').textContent=t(zh,en);$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4800)}
function go(dest){page=dest;render();window.scrollTo(0,0)}
function invalidate(x){x.stale=true;x.checked=false;x.confirmed=false;x.exported=false;}
function render(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.documentElement.style.fontSize=size+'px';$('#header').innerHTML=`<div class="brand"><svg aria-hidden="true" viewBox="0 0 40 40"><path d="M5 8 35 5 23 29 18 20Z" fill="#A6CE39" stroke="#5B5956" stroke-width="1.7"/><path d="m5 8 13 12L35 5M18 20l-2 10 7-1M7 30h5M7 35h17" fill="none" stroke="#5B5956" stroke-width="1.7"/></svg><span>投稿舱 ManuscriptDock</span></div>${btn(t('论文','Papers'),'home','quiet')}<div class="top-actions"><span class="meta local">◈ ${t('仅在本机','Local only')}</span><div class="seg">${btn('中文','zh','',`aria-pressed="${lang==='zh'}"`)}${btn('EN','en','',`aria-pressed="${lang==='en'}"`)}</div>${btn('Aa','font','quiet',`aria-label="${t('字号设置','Reading size')}"`)}${btn(t('设置','Settings'),'settings','quiet')}</div>`;
let nav=current?['overview','prepare','submit','archive']:[];let active=['target','materials','check'].includes(page)?'prepare':['package','log'].includes(page)?'submit':['versions','sources','proof','activity'].includes(page)?'archive':'overview';const names={overview:t('概览','Overview'),prepare:t('投稿准备','Preparation'),submit:t('投稿与修回','Submission'),archive:t('档案','Archive'),papers:t('全部论文','All papers')};$('#app').innerHTML=`<div class="shell"><nav class="sidebar" aria-label="${t('主导航','Main navigation')}">${mainNav()}${current?btn('← '+t('我的论文','My papers'),'home','quiet'):''}<div class="eyebrow nav-label" style="padding:12px">${t(current?'论文工作区':'我的工作台',current?'WORKSPACE':'MY WORKSPACE')}</div>${nav.map((n,i)=>btn(`<span class="nav-num">0${i+1}</span>${names[n]}`,n,(current?active===n:true)?'active':'',`aria-current="${(current?active===n:true)?'page':'false'}"`)).join('')}<div class="sidebar-note">LOCAL FIRST<br>${t('保留原稿<br>明确依据<br>作者掌控','Originals preserved<br>Traceable evidence<br>Author in control')}</div></nav><main class="content">${current?workspace():section==='library'?libraryList():paperList()}</main></div>`;}
function libraryItems(){return catalog.filter(x=>(library==='favorites'?x.favorite:x.libraries.includes(library))&&`${x.title} ${x.author} ${x.source}`.toLowerCase().includes(libraryQuery.trim().toLowerCase())&&Object.entries(libraryFilters).every(([k,v])=>!v||x[k]===v))}
function catalogActions(x){const added=papers.some(p=>p.catalogId===x.id);return `${btn(t('查看详情','View details'),`detail:${x.id}`)}${btn(x.favorite?t('取消收藏','Unfavorite'):t('收藏','Favorite'),`favorite:${x.id}`,'',`aria-pressed="${x.favorite}"`)}${btn(added?t('已加入我的论文','Added to my papers'):t('加入我的论文','Add to my papers'),`add-paper:${x.id}`,'primary',added?'disabled':'')}`}
function libraryList(){const l=libraries.find(x=>x.id===library),items=libraryItems();return `<div class="heading"><div class="eyebrow">RESEARCH LIBRARY</div><div class="row between"><h1>${esc(t(...l.name))}</h1>${btn('+ '+t('添加论文库','Add library'),'add-library')}</div><p class="muted">${t('浏览来源论文；收藏用于阅读整理，加入我的论文会创建独立工作副本。','Browse source papers. Favorites organize reading; adding creates an independent working copy.')}</p></div><section class="operation"><div class="library-filters"><label><span>${t('搜索','Search')}</span><input id="library-search" value="${esc(libraryQuery)}" placeholder="${t('标题、作者或来源','Title, author or source')}"></label>${[['field','领域','Field'],['type','类型','Type'],['year','年份','Year']].map(([key,zh,en])=>`<label><span>${t(zh,en)}</span><select data-library-filter="${key}"><option value="">${t('全部','All')}</option>${[...new Set(catalog.map(x=>x[key]))].sort().reverse().map(v=>`<option value="${esc(v)}" ${libraryFilters[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`).join('')}</div><div class="row between"><p class="meta" role="status">${items.length} ${t('篇论文','papers')}</p>${btn(t('清除筛选','Clear filters'),'library-clear','quiet')}</div>${items.length?items.map(x=>`<article class="paper-card"><span class="badge">${esc(x.type)} · ${x.year}</span><h2>${esc(x.title)}</h2><p class="meta">${esc(x.author)} · ${esc(x.field)}</p><p class="meta">${esc(x.source)}</p><p>${esc(x.abstract)}</p><div class="actions">${catalogActions(x)}</div></article>`).join(''):`<div class="empty"><h2>${t('暂无符合条件的论文','No matching papers')}</h2><p>${t('可清除筛选；新建本地库可以加入内置示例，收藏列表可从其他库收藏论文。','Clear filters, seed a local library, or favorite papers from another library.')}</p>${btn(t('清除筛选','Clear filters'),'library-clear')}${library.startsWith('local-')?btn(t('加入内置示例','Add built-in sample'),'seed-library','primary'):btn(t('浏览公共论文库','Browse public library'),'library:public')}</div>`}</section>`}
function catalogDetail(x){modal(t('论文详情 · 来源只读','Paper details · Read-only source'),`<h3>${esc(x.title)}</h3><p>${esc(x.author)}</p><p class="meta">${esc(x.field)} · ${esc(x.type)} · ${x.year}</p><p>${esc(x.abstract)}</p><div class="notice">${esc(x.source)}<br>${t('加入个人工作区不转移著作权，也不会执行投稿。','Adding does not transfer authorship or submit a paper.')}</div><div class="actions">${catalogActions(x)}</div>`,null,'',true)}

function paperList(){const visible=papers.filter(x=>(filter==='all'||lifecycle(x)===filter)&&x.title.toLowerCase().includes(query.toLowerCase())&&(!auxiliary.block||hasBlockers(x))&&(!auxiliary.stale||x.stale)&&(!auxiliary.target||x.target===auxiliary.target)).sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='block'?Number(hasBlockers(b))-Number(hasBlockers(a)):b.events.length-a.events.length);return `<div class="heading list-heading"><div class="row between"><div class="row"><h1>${t('我的论文','My papers')} <span class="muted">/ ${filter==='all'?t('全部','All'):t(...lifeNames[filter])}</span></h1><span class="meta" role="status">${visible.length} ${t('篇','papers')}</span></div>${btn('+ '+t('导入论文','Import manuscript'),'import','primary')}</div></div><div class="list-toolbar"><div class="row between"><label class="search"><span class="meta">${t('搜索论文标题','Search manuscript titles')}</span><input id="search" aria-label="${t('搜索论文','Search papers')}" placeholder="${t('搜索论文标题…','Search manuscript titles…')}" value="${esc(query)}"></label><label class="row meta">${t('排序','Sort')}<select id="sort" style="width:auto"><option value="recent" ${sort==='recent'?'selected':''}>${t('最近处理','Recently handled')}</option><option value="block" ${sort==='block'?'selected':''}>${t('阻断优先','Blockers first')}</option><option value="title" ${sort==='title'?'selected':''}>${t('标题','Title')}</option></select></label></div><div class="aux-filters"><label><input type="checkbox" data-aux="block" ${auxiliary.block?'checked':''}>${t('有阻断项','Has blockers')}</label><label><input type="checkbox" data-aux="stale" ${auxiliary.stale?'checked':''}>${t('需要重新检查','Recheck required')}</label><label>${t('目标期刊','Target journal')}<select data-aux="target"><option value="">${t('全部期刊','All journals')}</option>${[...new Set(papers.map(x=>x.target).filter(Boolean))].map(v=>`<option value="${esc(v)}" ${auxiliary.target===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label></div>${query||auxiliary.block||auxiliary.stale||auxiliary.target?btn(t('清除辅助筛选','Clear filters'),'clear','quiet clear-filters'):''}</div><div class="split list-split"><section class="operation">${visible.length?visible.map(x=>`<article class="paper-card"><div class="row paper-title"><h2>${btn(esc(x.title),`open:${x.id}`,'linklike')}</h2>${badge(x)}${btn('···',`more:${x.id}`,'quiet',`aria-label="${t('更多操作','More actions')}: ${esc(x.title)}"`)}</div><p class="meta paper-meta">${esc(x.target)||t('尚未选择目标期刊','No target selected')} · ${t('格式未记录','Format not recorded')} · v${x.v} · MS-${String(x.id).padStart(3,'0')} · ${t('更新','Updated')} ${x.events.length?esc(x.events[0].time):'2026-09-14'}</p>${lifeSummary(x)}<div class="row between bottom"><p class="muted paper-guidance">${next(x)[2]}</p><div class="row">${btn(t('查看详情','View details'),`open:${x.id}`,'linklike')}${btn(esc(next(x)[1])+' →',`stage-open:${x.id}:${next(x)[0]}`,'primary')}</div></div></article>`).join(''):`<div class="empty"><h2>${t('这里还没有论文','No manuscripts here')}</h2><p>${t('没有符合条件的论文。可清除搜索与辅助筛选，从左侧切换阶段，或导入新论文。','No matching papers. Clear search and auxiliary filters, select another stage in the sidebar, or import a manuscript.')}</p>${btn(t('清除筛选','Clear filters'),'clear')}${btn(t('导入论文','Import manuscript'),'import')}</div>`}</section></div>`;}
function workspace(){const x=p();let group=['target','materials','check'].includes(page)?['target','materials','check']:['package','log'].includes(page)?['package','log']:['versions','sources','proof','activity'].includes(page)?['versions','sources','proof','activity']:[];return `<div class="heading"><div class="eyebrow">${t('论文','PAPERS')} / MS-${String(x.id).padStart(3,'0')} / v${x.v}</div><div class="row between"><h1>${esc(x.title)}</h1><div class="row">${btn(t('查看依据','Evidence'),'evidence','mobile-evidence')}${btn('···',`more:${x.id}`,'quiet',`aria-label="${t('论文操作','Paper actions')}"`)}</div></div><p class="meta">${esc(x.target)||t('尚未选择目标期刊','No target selected')} · ${t('原稿保留 · 本机工作副本','Original preserved · Local working copy')}</p>${lifeProgress(x)}</div>${x.archived?`<div class="notice">${t('此项目已归档；恢复后可继续操作。','This project is archived. Restore it to continue.')}${btn(t('恢复项目','Restore project'),'restore')}</div>`:''}${group.length?`<nav class="tabs" aria-label="${t('任务页面','Task pages')}">${group.map(k=>btn(label(k),`page:${k}`,page===k?'active':'',`aria-current="${page===k?'page':'false'}"`)).join('')}</nav>`:''}<div class="split"><section class="operation">${pageContent(x)}</section><aside class="evidence">${evidence(x)}</aside></div>`;}

function modal(title,body,action=null,actionLabel='',drawer=false){const d=$('#overlay');if(d.open)d.close();returnFocus=document.activeElement;confirmAction=action;d.className=drawer?'drawer':'';d.innerHTML=`${btn('×','close','close',`aria-label="${t('关闭','Close')}"`)}<h2 id="dialog-title" tabindex="-1">${title}</h2><div class="dialog-body">${body}</div>${action?`<div class="actions">${btn(t('暂不操作','Not now'),'close')}${btn(actionLabel,'confirm','primary')}</div>`:''}`;d.showModal();$('#dialog-title').focus();}
function closeModal(){taskToken++;const d=$('#overlay');d.close();confirmAction=null;if(returnFocus?.isConnected)returnFocus.focus();else $('#header button')?.focus();}
$('#overlay').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
function confirm(title,body,fn,text){modal(title,`<p>${body}</p>`,()=>{closeModal();fn()},text)}
function asyncDemo(title,fn){const token=++taskToken;const show=()=>{modal(title,`<div class="empty"><div class="spinner"></div><p role="status">${t('正在处理…','Processing…')}</p>${btn(t('取消本次操作','Cancel operation'),'close')}${btn(t('触发失败状态','Trigger failure'),'fail')}</div>`);const id=setTimeout(()=>{if(token!==taskToken||!$('#overlay').open)return;closeModal();fn();},1800);$('#overlay [data-action=fail]').onclick=e=>{e.stopPropagation();clearTimeout(id);modal(t('处理失败','Processing failed'),`<p role="alert">${t('原稿和已输入资料未受影响。可重试或取消。','Original files and entered data are unchanged. Retry or cancel.')}</p><div class="actions">${btn(t('重试','Retry'),'retry','primary')}${btn(t('取消','Cancel'),'close')}</div>`);$('#overlay [data-action=retry]').onclick=e=>{e.stopPropagation();show()};};};show();}
function importDialog(){modal(t('导入论文','Import manuscript'),`<p>${t('支持 DOCX / PDF / TEX，最大 20 MB。','DOCX / PDF / TEX, up to 20 MB.')}</p><label class="field"><span>${t('选择主稿','Select manuscript')}</span><input id="import-file" type="file" accept=".docx,.pdf,.tex"></label><p id="file-info" class="meta">${t('尚未选择主稿；也可以使用内置示例。','No file selected. You can use the built-in sample.')}</p><div class="actions">${btn(t('使用示例主稿','Use sample manuscript'),'import-sample')}${btn(t('创建论文项目','Create paper project'),'import-create','primary','disabled')}</div><div class="notice">${t('原稿不会被覆盖。失败或取消不会创建半成品项目。','Originals are never overwritten. Failure or cancellation creates no partial project.')}</div>`);}

function runCheck(basic=false){const x=p();if(x.archived)return;asyncDemo(t('运行检查','Running checks'),()=>{x.checked=true;x.confirmed=false;x.stale=false;event(x,basic?'基础检查完成，STR-003 待作者确认':'目标检查完成，STR-003 待作者确认',basic?'Basic checks completed; STR-003 awaits author confirmation':'Target checks completed; STR-003 awaits author confirmation');page='check';render();toast('检查完成；请确认摘要问题。','Checks complete. Please confirm the abstract finding.');});}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const [a,arg]=b.dataset.action.split(':');
if(a==='toggle-library'){libraryOpen=!libraryOpen;render()}
if(a==='toggle-mine'){mineOpen=!mineOpen;current=null;section='mine';filter='all';render()}
if(a==='my-all'||a==='life'){current=null;section='mine';mineOpen=true;filter=a==='life'?arg:'all';render();$(`[data-action="${b.dataset.action}"]`).focus()}
if(a==='library'){current=null;section='library';library=arg;libraryOpen=true;libraryQuery='';libraryFilters={field:'',type:'',year:''};render()}
if(a==='library-clear'){libraryQuery='';libraryFilters={field:'',type:'',year:''};render();toast('已清除论文库筛选。','Library filters cleared.')}
if(a==='add-library'){modal(t('添加论文库','Add library'),`<label class="field"><span>${t('论文库名称 *','Library name *')}</span><input id="library-name" maxlength="40" required></label><label class="checklabel"><input id="library-seed" type="checkbox" checked><span>${t('加入两篇内置示例来源论文','Include two built-in source papers')}</span></label>`,()=>{const input=$('#library-name'),name=input.value.trim();if(!name){input.setCustomValidity(t('请输入名称。','Enter a name.'));input.reportValidity();input.oninput=()=>input.setCustomValidity('');return}if(libraries.some(l=>l.name.some(n=>n.toLowerCase()===name.toLowerCase()))){toast('论文库名称已存在，请更换。','Library name already exists.');return}const id='local-'+libraries.length;libraries.push({id,name:[name,name]});if($('#library-seed').checked)catalog.slice(0,2).forEach(x=>x.libraries.push(id));closeModal();current=null;section='library';library=id;libraryOpen=true;libraryQuery='';libraryFilters={field:'',type:'',year:''};render();toast('本地论文库已创建。','Local library created.')},t('创建本地库','Create local library'))}
if(a==='seed-library'){catalog.slice(0,2).forEach(x=>{if(!x.libraries.includes(library))x.libraries.push(library)});libraryQuery='';libraryFilters={field:'',type:'',year:''};render();toast('已加入内置示例来源论文。','Built-in source papers added.')}
if(['detail','favorite','add-paper'].includes(a)){const item=catalog.find(x=>x.id===Number(arg));if(a==='detail')return catalogDetail(item);if(a==='favorite'){item.favorite=!item.favorite;const opened=$('#overlay').open;render();if(opened)catalogDetail(item);toast(item.favorite?'已加入我的收藏。':'已取消收藏。',item.favorite?'Added to favorites.':'Removed from favorites.')}if(a==='add-paper'){if(papers.some(x=>x.catalogId===item.id))return;const copy=makePaper(nextId++,item.title,1,'',{catalogId:item.id,source:item.source,author:item.author,email:''});papers.unshift(copy);event(copy,'从来源论文创建独立工作副本；不代表作者身份或投稿授权','Independent working copy created; no authorship or submission authorization implied');if($('#overlay').open)closeModal();render();toast('已加入我的论文 · 草稿；可从左侧进入工作区。','Added to My papers · Draft. Open it from the sidebar.')}}
});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){const pos=e.target.selectionStart;libraryQuery=e.target.value;render();$('#library-search').focus();$('#library-search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const key=e.target.dataset.libraryFilter;if(key){libraryFilters[key]=e.target.value;render();$(`[data-library-filter="${key}"]`).focus()}});
function selectLifeNode(button){
const [,id,key]=button.dataset.action.split(':'),x=papers.find(item=>item.id===Number(id));
if(!x||current!==x.id||button.getAttribute('role')!=='tab')return;
lifeSelection.set(x.id,key);
button.closest('[role=tablist]').querySelectorAll('[role=tab]').forEach(tab=>{const selected=tab===button;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1});
const panel=$(`#life-panel-${x.id}`);panel.innerHTML=lifeContent(x,key);panel.setAttribute('aria-labelledby',button.id);
}
document.addEventListener('keydown',e=>{
const tab=e.target.closest('.life-node[role=tab]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
e.preventDefault();const tabs=[...tab.parentElement.querySelectorAll('[role=tab]')],index=tabs.indexOf(tab),nextTab=tabs[e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];
selectLifeNode(nextTab);nextTab.focus({preventScroll:true});nextTab.scrollIntoView({block:'nearest',inline:'nearest'});
});
document.addEventListener('click',e=>{
const button=e.target.closest('button[data-action]');if(!button||button.disabled)return;
const [action,id,dest]=button.dataset.action.split(':');
if(action==='stage'){selectLifeNode(button);return}
if(action==='stage-open'){current=Number(id);go(dest==='basic'?'check':dest);toast('已打开该论文工作区，继续处理所选任务。','Workspace opened for the selected task.');if(dest==='basic')runCheck(true)}
});
/* 事件委托与状态转换：导出历史、投稿事实和当前有效性独立保存。 */
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const [a,arg]=b.dataset.action.split(':');const x=p();if(a==='close')return closeModal();if(a==='confirm')return confirmAction?.();if(a==='home'||a==='papers'){current=null;section='mine';mineOpen=true;filter='all';render();return}if(a==='open'){current=Number(arg);go('overview');return}if(a==='page')return go(arg);if(a==='overview')return go('overview');if(a==='prepare')return go('target');if(a==='submit')return go('package');if(a==='archive')return go('versions');if(a==='filter'){filter=arg;render();return}if(a==='clear'){query='';auxiliary={block:false,stale:false,target:''};render();$('#search').focus();return}if(a==='zh'||a==='en'){lang=a;try{localStorage.setItem('md-demo-lang',lang)}catch(e){}render();return}if(a==='font'){modal(t('阅读字号','Reading size'),`<p>${t('仅调整界面，不改变原稿。','Changes the interface, not the manuscript.')}</p><div class="actions">${[14,15,17].map(v=>btn(v+'px',`size:${v}`,size===v?'primary':'',`aria-pressed="${size===v}"`)).join('')}</div>`);return}if(a==='size'){size=Number(arg);try{localStorage.setItem('md-demo-size',size)}catch(e){}closeModal();render();return}if(a==='settings'){modal(t('设置与帮助','Settings & help'),`<details><summary>${t('流程与列表帮助','Workflow & list help')}</summary><p>${t('确认目标与要求 → 补全资料并检查 → 导出投稿包 → 手动登记投稿。导出不等于已投稿，登记不代表平台验证。','Set target and requirements → Complete materials and checks → Export package → Record submission manually. Export is not submission; records are not platform-verified.')}</p><p>${t('每篇论文仅计入一个当前阶段；历史不重复计数。卡片时间轴只读，详情时间轴可查看各阶段信息。','Each paper counts in one current stage only. Card timelines are read-only; detail timelines let you inspect stages.')}</p><p>${t('操作流程：Aerial Image Restoration → 声明 → 检查 → 投稿包 → 投稿登记。','Walkthrough: Aerial Image Restoration → Declaration → Checks → Package → Submission record.')}</p></details><p>${t('语言和字号偏好保存在浏览器本机。','Language and reading size are saved in this browser.')}</p>`,null,'',true);return}if(a==='evidence'){modal(t('依据与来源','Evidence & sources'),`<span class="badge">${t('规则检查','Rule check')}</span><section class="section"><h3>STR-003 · Abstract</h3><p>${t('位置：第 1 页，摘要。目的 / 方法 / 结果由作者确认；规则示例并非期刊官方要求。','Location: page 1, abstract. Purpose / methods / results require author confirmation. Sample rule, not official journal requirements.')}</p></section><section class="section"><h3>${t('来源与绑定','Source & binding')}</h3><p>${esc(x.title)} · v${x.v}<br>${esc(x.target)||t('基础主稿规则','Basic manuscript rules')}</p><p>${t('规则快照：2026-09-15。','Rule snapshot: 2026-09-15.')}</p></section>`,null,'',true);return}if(a==='more'){const item=papers.find(v=>v.id===Number(arg));modal(esc(item.title),`<div class="actions">${btn(t('查看档案','View archive'),`archive-item:${item.id}`)}${btn(t(item.archived?'恢复项目':'归档项目',item.archived?'Restore project':'Archive project'),`archive-confirm:${item.id}`)}${btn(t('删除项目','Delete project'),`delete:${item.id}`,'danger')}</div>`,null,'',true);return}if(a==='archive-item'){closeModal();current=Number(arg);go('versions');return}if(a==='archive-confirm'||a==='delete'){const item=papers.find(v=>v.id===Number(arg));confirm(t(a==='delete'?'删除此项目？':'更改归档状态？',a==='delete'?'Delete this project?':'Change archive state?'),t(a==='delete'?'此操作移除论文项目及记录，不可撤销；原稿文件不受影响。':'归档将暂停处理并保留版本和历史，之后可恢复。',a==='delete'?'This removes the paper project and records and cannot be undone. Original files are unaffected.':'Archiving pauses work and preserves versions and history. You can restore it later.'),()=>{if(a==='delete'){papers=papers.filter(v=>v!==item);if(current===item.id)current=null}else{item.archived=!item.archived;event(item,item.archived?'项目已归档':'项目已恢复',item.archived?'Project archived':'Project restored')}render();toast('项目状态已更新。','Project state updated.')},t(a==='delete'?'删除项目':'更改归档状态',a==='delete'?'Delete project':'Change archive state'));return}if(a==='restore'){x.archived=false;event(x,'项目已恢复','Project restored');render();return}if(a==='sample'){x.declaration='The authors declare no competing interests.';$('[name=declaration]').value=x.declaration;return}if(a==='target-save'){const target=$('#target-select').value;if(target===x.target){toast('目标未变化。','Target unchanged.');return}confirm(t('更改目标期刊？','Change target journal?'),t('将使旧检查和要求快照失效，需要更新要求并重新检查；历史投稿事实保留。','Previous checks and requirements will expire. Update the snapshot and rerun checks; historical submission facts remain.'),()=>{x.target=target;x.requirements=false;invalidate(x);event(x,'目标变更，检查与要求已失效','Target changed; checks and requirements expired');render();toast('目标已更新；请更新要求快照。','Target updated. Refresh the requirements snapshot.')},t('更改目标','Change target'));return}if(a==='expire'){x.requirements=false;invalidate(x);event(x,'要求快照过期','Requirements snapshot expired');render();return}if(a==='requirements'){asyncDemo(t('更新要求快照','Updating snapshot'),()=>{x.requirements=true;invalidate(x);event(x,'要求快照已更新，需重新检查','Requirements snapshot updated; recheck required');render();toast('要求快照已更新，请重新检查。','Requirements snapshot updated. Recheck required.')});return}if(a==='basic'||a==='run-check')return runCheck(a==='basic');if(a==='confirm-issue'){confirm(t('确认摘要问题已处理？','Confirm abstract finding resolved?'),t('由作者确认当前版本摘要满足要求。不会自动编辑原稿，也不代表专业审核通过。','The author confirms this version meets the abstract requirements. No automatic edits or professional approval.'),()=>{x.confirmed=true;event(x,`STR-003 已由作者确认 · v${x.v}`,`STR-003 confirmed by author · v${x.v}`);render();toast('问题已确认；下一步已更新。','Finding confirmed. Your next action has been updated.')},t('确认已处理','Confirm resolved'));return}if(a==='preview'){modal(t('投稿包预览','Package preview'),`${evidence(x)}<p class="meta">${t('预览投稿包清单和上下文。','Preview the package manifest and context.')}</p>`,null,'',true);return}if(a==='export'){confirm(t('导出投稿包？','Export package?'),t('将创建当前版本的导出记录；导出不等于已投稿。','Creates an export record for the current version; export is not submission.'),()=>{x.exported=true;x.exports.unshift({v:x.v,target:x.target,time:new Date().toLocaleString('sv-SE')});event(x,`投稿包导出记录 · v${x.v} · 尚未自动登记投稿`,`Package export record · v${x.v} · No automatic submission record`);render();modal(t('导出记录已创建','Export record created'),`<p class="warning">${t('导出记录已创建，不代表已向期刊投稿。','The export record has been created; this does not mean submission to a journal.')}</p>${btn(t('手动登记投稿 →','Manually record submission →'),'export-next','primary')}`)},t('确认导出','Confirm export'));return}if(a==='export-next'){closeModal();go('log');return}if(a==='version'||a==='new-version'){const v=a==='version'?Number(arg):Math.max(...x.versions)+1;confirm(t('切换当前工作版本？','Switch working version?'),t('原稿和历史事实保留；当前检查失效，补充材料需要重新确认，投稿包需要重新生成。','Original and historical facts remain. Checks expire, materials need reconfirmation, and the package must be regenerated.'),()=>{if(!x.versions.includes(v))x.versions.push(v);x.v=v;x.materials=false;invalidate(x);event(x,`已切换至 v${v}，当前检查与资料确认失效`,`Switched to v${v}; checks and material confirmation expired`);go('overview');toast('工作版本已切换；请重新检查并确认资料。','Working version changed. Recheck and reconfirm materials.')},t('切换并重新检查','Switch & require recheck'));return}if(a==='diff'){modal(t('版本差异','Version differences'),`<p>${t('原稿 v1 → 当前工作版本','Original v1 → Current version')} v${x.v}</p><div class="notice">${t('请核对摘要的方法说明及补充材料关联是否发生变化。','Review whether the abstract method description and supplementary material associations have changed.')}</div>`,null,'',true);return}if(a==='import'){importName='';importDialog();return}if(a==='import-sample'){importName='New Research Manuscript.docx';$('#file-info').textContent=importName+' · 128 KB';$('[data-action=import-create]').disabled=false;return}if(a==='import-create'&&importName){const name=importName;asyncDemo(t('创建论文项目','Creating manuscript project'),()=>{const item=makePaper(nextId++,name.replace(/\.[^.]+$/,''),1,'');papers.unshift(item);current=item.id;event(item,'论文项目已创建 · v1','Manuscript project created · v1');go('overview');toast('论文项目及 v1 已创建，下一步：补充资料。','Manuscript project and v1 created; next: complete materials.')});}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}if(e.target.closest('#materials-form')){const x=p();const f=e.target;if(f.name==='attachment')x.attachment=f.checked;else if(f.name)x[f.name]=f.value;}if(e.target.closest('#log-form')){const x=p();x.logDraft=Object.fromEntries(new FormData($('#log-form')));}});
document.addEventListener('change',e=>{const key=e.target.dataset.aux;if(key){auxiliary[key]=key==='target'?e.target.value:e.target.checked;render();$(`[data-aux="${key}"]`).focus()}if(e.target.id==='sort'){sort=e.target.value;render();$('#sort').focus()}if(e.target.id==='import-file'){const file=e.target.files[0];importName='';const valid=file&&/\.(docx|pdf|tex)$/i.test(file.name)&&file.size<=20*1024*1024;$('[data-action=import-create]').disabled=!valid;if(valid){importName=file.name;$('#file-info').textContent=file.name+' · '+(file.size/1024).toFixed(1)+' KB'}else $('#file-info').textContent=t('请选择不超过 20 MB 的 DOCX、PDF 或 TEX 文件。','Choose a DOCX, PDF or TEX file no larger than 20 MB.')}});
document.addEventListener('submit',e=>{e.preventDefault();const x=p();if(!x||x.archived)return;const values=Object.fromEntries(new FormData(e.target));if(e.target.id==='materials-form'){if(!values.author.trim()||!values.declaration.trim()){toast('作者和声明不能仅为空格。','Author and declaration cannot be whitespace.');return}Object.assign(x,values,{attachment:true,materials:true});x.checked=false;x.confirmed=false;x.exported=false;event(x,`资料已保存并确认 · v${x.v}`,`Materials saved and confirmed · v${x.v}`);render();toast('声明已保存到本页工作区；下一步：检查与修订。','Declaration saved to this page’s workspace. Next: checks & revisions.')}if(e.target.id==='log-form'){if(!values.platform.trim()||!values.number.trim()){toast('期刊和稿件编号不能为空白。','Journal and manuscript ID cannot be blank.');return}x.records.unshift({...values,v:x.v});x.logDraft=null;event(x,`手动登记投稿 ${values.number}（未经平台验证）`,`Submission ${values.number} manually recorded (unverified)`);render();toast('投稿事实已手动记录，未经平台验证。','Submission manually recorded; not platform-verified.')}});
render();
